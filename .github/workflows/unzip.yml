name: Unzip Project
on:
  push:
    paths:
      - '**.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and flatten
        run: |
          echo "Files in root:"
          ls -la
          ZIPFILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          echo "Found zip: $ZIPFILE"
          if [ -n "$ZIPFILE" ]; then
            unzip -o "$ZIPFILE"
            echo "After unzip:"
            ls -la
          fi
          if [ -d "stylesutra" ]; then
            echo "Copying stylesutra/ contents to root"
            cp -rf stylesutra/. .
            rm -rf stylesutra
          else
            echo "No stylesutra folder found after unzip!"
          fi
          find . -maxdepth 1 -name "*.zip" -delete
          echo "Final root listing:"
          ls -la
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "Auto-unzip project" || echo "Nothing to commit"
          git push
